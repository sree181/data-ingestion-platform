services:
  # Elasticsearch Cluster (Primary Storage & Search)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=data-platform
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./elasticsearch/config:/usr/share/elasticsearch/config/custom
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana for Elasticsearch UI
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    volumes:
      - kibana_data:/usr/share/kibana/data

  # Neo4j Knowledge Graph Database
  neo4j:
    image: neo4j:5.15-community
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_config_strict__validation_enabled=false
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO for Object Storage (Documents, Images)
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # PostgreSQL for Application Metadata
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: dataplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Apache Kafka for Streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_HOST_NAME: kafka
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Redis for Caching and Session Management
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Apache Spark for ETL Processing
  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./spark/jars:/opt/bitnami/spark/jars/custom
      - ./spark/conf:/opt/bitnami/spark/conf/custom

  spark-worker:
    image: bitnami/spark:3.5
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no

  # API Gateway (FastAPI)
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      - postgres
      - redis
      - elasticsearch
      - neo4j
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/dataplatform
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=minio123
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - OPENAI_API_KEY=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
      - OPENAI_MODEL=gpt-4
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./Searchable:/app/Searchable:ro

  # Document Processing Service with LlamaParse
  document-processor:
    build:
      context: ./services/document-processor
      dockerfile: Dockerfile
    container_name: document-processor
    command: ["python", "simple_processor.py"]
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - kafka
      - minio
      - elasticsearch
      - neo4j
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/dataplatform
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=minio123
      - LLAMA_CLOUD_API_KEY=${LLAMAPARSE_API_KEY:-}
      - llama_parse_key=${LLAMAPARSE_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # PubMed Integration Service
  pubmed-integration:
    build:
      context: ./services/pubmed-integration
      dockerfile: Dockerfile
    container_name: pubmed-integration
    ports:
      - "8007:8005"
    depends_on:
      - document-processor
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
    volumes:
      - ./data:/app/data

  # Ollama Service for Local AI Models
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped

  # Entity Extraction & Knowledge Graph Builder
  knowledge-builder:
    build:
      context: ./services/knowledge-builder
      dockerfile: Dockerfile
    container_name: knowledge-builder
    depends_on:
      - neo4j
      - elasticsearch
      - kafka
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - OPENAI_API_KEY=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
      - SPACY_MODEL=en_core_web_lg
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # Streaming Processor
  streaming-processor:
    build:
      context: ./services/streaming-processor
      dockerfile: Dockerfile
    container_name: streaming-processor
    depends_on:
      - kafka
      - elasticsearch
      - spark-master
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123

  # Entity Enrichment Service (Firecrawl Integration)
  entity-enrichment:
    build:
      context: ./services/entity-enrichment-service
      dockerfile: Dockerfile
    container_name: entity-enrichment
    environment:
      - FIRECRAWL_API_KEY=fc-7669b1d6be7a48a8bd22daf82e3b04b3
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/dataplatform
      - OPENAI_API_KEY=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
    ports:
      - "8003:8003"
    depends_on:
      - postgres
      - redis
      - api-gateway
    restart: unless-stopped
    networks:
      - default

  # Document Chat Service (AI-Powered Document Chatbot)
  document-chat:
    build:
      context: ./services/document-chat-service
      dockerfile: Dockerfile
    container_name: document-chat
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/dataplatform
      - OPENAI_API_KEY=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
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    ports:
      - "8004:8004"
    depends_on:
      - postgres
      - elasticsearch
      - api-gateway
    restart: unless-stopped
    networks:
      - default

  # Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-ui
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - default

  # Lease Obligation Extractor Service
  lease-obligation-extractor:
    build:
      context: ./services/lease-obligation-extractor
      dockerfile: Dockerfile
    container_name: lease-obligation-extractor
    ports:
      - "8005:8005"
    environment:
      - OPENAI_API_KEY=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
      - OPENAI_MODEL=gpt-4
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/dataplatform
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - ./services/lease-obligation-extractor:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8005 --reload
    depends_on:
      - postgres
      - elasticsearch
      - api-gateway
    restart: unless-stopped
    networks:
      - default

  # Lease Comparison Engine Service
  lease-comparison-engine:
    build:
      context: ./services/lease-comparison-engine
      dockerfile: Dockerfile
    container_name: lease-comparison-engine
    ports:
      - "8006:8006"
    environment:
      - OPENAI_API_KEY=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
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/dataplatform
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - ./services/lease-comparison-engine:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8006 --reload
    depends_on:
      - postgres
      - elasticsearch
      - api-gateway
    restart: unless-stopped
    networks:
      - default

volumes:
  elasticsearch_data:
  kibana_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  minio_data:
  postgres_data:
  zookeeper_data:
  kafka_data:
  redis_data:
  prometheus_data:
  grafana_data:
  ollama_data:

networks:
  default:
    name: dataplatform-network