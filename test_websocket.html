<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>
    <h1>WebSocket Test for Ingestion Updates</h1>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    
    <script>
        const status = document.getElementById('status');
        const messages = document.getElementById('messages');
        
        // Connect to WebSocket
        const ws = new WebSocket('ws://localhost:8000/ws/ingestion');
        
        ws.onopen = function(event) {
            status.textContent = 'Connected to WebSocket';
            status.style.color = 'green';
            
            // Request document count update
            ws.send(JSON.stringify({
                type: 'request_document_count',
                project_id: 'test-project'
            }));
        };
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            console.log('Received:', data);
            
            const messageDiv = document.createElement('div');
            messageDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${JSON.stringify(data, null, 2)}`;
            messageDiv.style.border = '1px solid #ccc';
            messageDiv.style.margin = '5px';
            messageDiv.style.padding = '10px';
            messages.appendChild(messageDiv);
        };
        
        ws.onclose = function(event) {
            status.textContent = 'WebSocket disconnected';
            status.style.color = 'red';
        };
        
        ws.onerror = function(error) {
            status.textContent = 'WebSocket error: ' + error;
            status.style.color = 'red';
        };
    </script>
</body>
</html>
